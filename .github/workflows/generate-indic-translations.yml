name: Generate remaining Indian translations

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Indian language code (mr, gu, bn, ta, te, kn, ml, pa, or, as, ne)"
        required: true
        default: "mr"
      limit:
        description: "Optional verse limit for testing"
        required: false
        default: "5"

concurrency:
  group: gita-indic-translations
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install IndicTrans2 inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" sentencepiece sacremoses pandas regex mock accelerate
          git clone --depth 1 https://github.com/VarunGumma/IndicTransToolkit
          python -m pip install -e IndicTransToolkit
      - name: Generate Indian translations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/generate-indic-translations.py "${{ inputs.language }}" --limit="${{ inputs.limit }}"
