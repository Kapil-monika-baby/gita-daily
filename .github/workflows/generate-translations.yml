name: Generate Gita translations

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Target language code, or all"
        required: true
        default: "hi"
      chapter:
        description: "Optional chapter number"
        required: false
        default: ""

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free offline translation engine
        run: python -m pip install --upgrade pip && python -m pip install argostranslate

      - name: Generate translations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.chapter }}" ]; then
            python scripts/generate-translations.py "${{ inputs.language }}" --chapter="${{ inputs.chapter }}"
          else
            python scripts/generate-translations.py "${{ inputs.language }}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Validate generated translations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run translations:validate -- --language="${{ inputs.language }}"
